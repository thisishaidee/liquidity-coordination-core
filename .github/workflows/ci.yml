name: CI and Deploy

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nerith-pr-{0}', github.event.pull_request.number) || format('nerith-production-{0}', github.ref) }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir=dist
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist/
          if-no-files-found: error

  hermes-unpaid-402:
    # External network probe only on pull requests. No Cloudflare or wallet secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture an unpaid Swap.io Hermes quote challenge
        run: node scripts/test-hermes-402.mjs
      - name: Upload raw Hermes response and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-unpaid-402-evidence
          path: artifacts/hermes-402/
          if-no-files-found: warn
          retention-days: 14

  worker-x402-local:
    # Exercises the real Worker and a disposable local D1 database; no secrets.
    if: github.event_name == 'pull_request'
    needs: hermes-unpaid-402
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check the local integration test script syntax
        run: node --check scripts/test-worker-x402-local.mjs
      - name: Apply migrations, seed isolated fixtures, and test Worker-to-Hermes relay
        run: node scripts/test-worker-x402-local.mjs
      - name: Upload local Worker and D1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerith-worker-local-x402-evidence
          path: artifacts/worker-x402/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply pending production D1 migrations
        run: npx wrangler d1 migrations apply liquidity-coordination --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy NERITH Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
