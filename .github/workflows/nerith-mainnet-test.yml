name: NERITH isolated mainnet test

on:
  push:
    branches:
      - feat/solana-wallet-ownership-proof
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "scripts/**"
      - "wallet-connect/**"
      - "test/**"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.mainnet-test.toml"
      - ".github/workflows/nerith-mainnet-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nerith-mainnet-testing
  cancel-in-progress: false

jobs:
  deploy-isolated-mainnet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Build embedded website pages
        run: npm run build:dashboard
      - name: Apply migrations to isolated mainnet test D1
        run: npx wrangler d1 migrations apply nerith-mainnet-testing --remote --config wrangler.mainnet-test.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy isolated mainnet test Worker
        run: npx wrangler deploy --config wrangler.mainnet-test.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify isolated mainnet test Worker health
        run: |
          node --input-type=module -e '
            const url = "https://nerith-mainnet-testing.haideecoded-e0f.workers.dev/health";
            const response = await fetch(url);
            const body = await response.json();
            if (!response.ok || body.status !== "ok" || body.database !== "connected") {
              throw new Error("Mainnet test Worker health check failed: " + JSON.stringify(body));
            }
            console.log(JSON.stringify(body));
          '
